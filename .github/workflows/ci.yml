name: Verificaciones

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  calidad:
    name: Calidad y seguridad básica
    runs-on: ubuntu-latest
    services:
      postgres-auth:
        image: postgres:18.7
        env:
          POSTGRES_USER: ps003_test
          POSTGRES_DB: portal_ps003_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ps003_test -d portal_ps003_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preparar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Preparar pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.21.0

      - name: Confirmar versiones fijadas
        run: |
          node --version
          pnpm --version
          test "$(node --version)" = "v24.22.3"
          test "$(pnpm --version)" = "12.21.0"

      - name: Instalar dependencias fijadas
        run: pnpm install --frozen-lockfile

      - name: Verificar skills y política de agentes
        run: pnpm verify:skills

      - name: Comprobar formato
        run: pnpm format:check

      - name: Analizar código
        run: pnpm lint

      - name: Ejecutar pruebas
        run: pnpm test

      - name: Ejecutar pruebas de integración en PostgreSQL aislado
        env:
          TEST_DATABASE_URL: postgres://ps003_test@127.0.0.1:5432/portal_ps003_test
        run: pnpm test:integration

      - name: Construir aplicaciones
        env:
          API_INTERNAL_ORIGIN: http://127.0.0.1:4100
        run: pnpm build

      # Next.js genera .next/types, que next-env.d.ts incluye en el typecheck.
      - name: Comprobar tipos
        run: pnpm typecheck

      - name: Buscar secretos
        run: pnpm check:secrets

      - name: Auditar dependencias de producción
        run: corepack pnpm@12.21.0 audit --prod --audit-level high

      - name: Auditar dependencias y evaluar excepción aprobada de desarrollo
        run: corepack pnpm@12.21.0 run check:dependencies:ci
