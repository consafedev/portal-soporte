name: Verificaciones

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  calidad:
    name: Calidad y seguridad básica
    runs-on: ubuntu-24.04
    env:
      PG_BIN_DIR: /usr/lib/postgresql/18/bin
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preparar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Preparar pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.21.0

      - name: Confirmar versiones fijadas
        run: |
          node --version
          pnpm --version
          test "$(node --version)" = "v24.22.3"
          test "$(pnpm --version)" = "12.21.0"

      - name: Preparar binarios PostgreSQL 18.7 en el runner efímero
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common ca-certificates curl gpg
          sudo install -d -m 0755 /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error --location \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          fingerprint="$(gpg --show-keys --with-colons /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc | awk -F: '$1 == "fpr" { print $10; exit }')"
          test "$fingerprint" = "B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8"
          printf '%s\n' \
            'Types: deb' \
            'URIs: https://apt.postgresql.org/pub/repos/apt' \
            'Suites: noble-pgdg' \
            'Architectures: amd64' \
            'Components: main' \
            'Signed-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc' \
            | sudo tee /etc/apt/sources.list.d/pgdg.sources >/dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-18=18.7-1.pgdg24.04+2
          /usr/lib/postgresql/18/bin/postgres --version
          version="$(/usr/lib/postgresql/18/bin/postgres --version | sed -nE 's/^postgres \(PostgreSQL\) ([0-9]+\.[0-9]+).*/\1/p')"
          test "$version" = "18.7"
          if sudo pg_ctlcluster 18 main status >/dev/null 2>&1; then
            sudo pg_ctlcluster 18 main stop
          fi

      - name: Instalar dependencias fijadas
        run: pnpm install --frozen-lockfile

      - name: Instalar Chromium de Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Verificar skills y política de agentes
        run: pnpm verify:skills

      - name: Comprobar formato
        run: pnpm format:check

      - name: Analizar código
        run: pnpm lint

      - name: Ejecutar pruebas
        run: pnpm test

      - name: Ejecutar pruebas de integración en PostgreSQL aislado
        run: pnpm test:integration

      - name: Verificar CLI de migración en PostgreSQL aislado
        run: pnpm test:migrate-cli

      - name: Construir aplicaciones
        env:
          API_INTERNAL_ORIGIN: http://127.0.0.1:4100
        run: pnpm build

      # Next.js genera .next/types, que next-env.d.ts incluye en el typecheck.
      - name: Comprobar tipos
        run: pnpm typecheck

      - name: Validar flujos de autenticación en navegador aislado
        run: pnpm test:e2e

      - name: Buscar secretos
        run: pnpm check:secrets

      - name: Auditar dependencias de producción
        run: corepack pnpm@12.21.0 audit --prod --audit-level high

      - name: Auditar dependencias y evaluar excepción aprobada de desarrollo
        run: corepack pnpm@12.21.0 run check:dependencies:ci
