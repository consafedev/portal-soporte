name: Verificaciones

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  calidad:
    name: Calidad y seguridad básica
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preparar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Preparar pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.21.0

      - name: Instalar dependencias fijadas
        run: pnpm install --frozen-lockfile

      - name: Verificar skills y política de agentes
        run: pnpm verify:skills

      - name: Comprobar formato
        run: pnpm format:check

      - name: Analizar código
        run: pnpm lint

      - name: Ejecutar pruebas
        run: pnpm test

      - name: Construir aplicaciones
        run: pnpm build

      # Next.js genera .next/types, que next-env.d.ts incluye en el typecheck.
      - name: Comprobar tipos
        run: pnpm typecheck

      - name: Buscar secretos
        run: pnpm check:secrets

      - name: Revisar dependencias
        run: pnpm check:dependencies
